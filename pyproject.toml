[project]
name = "copy-trader"
version = "0.1.0"
description = "Trader intelligence research: Hyperliquid data collection and persistence analysis"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "polars>=1.0"]

[project.scripts]
copy-trader = "collector.sync:main"

[dependency-groups]
research = ["duckdb>=1.1", "jupyterlab>=4.2", "matplotlib>=3.9", "nbconvert>=7", "pyarrow>=17"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["collector", "analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
